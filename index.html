<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type=".favicon.ico" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pomotention</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!-- 移动端 Web App 支持 -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Apple iOS 配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pomotention" />
    
    <!-- Apple Touch Icons - 多尺寸支持 -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icon-128.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    
    <!-- Apple 启动画面 - 针对不同设备尺寸 -->
    <link rel="apple-touch-startup-image" href="/icon-512.png" />
    
    <!-- 移动端优化标签 -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <style id="pwa-boot-style">
      #pwa-boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #pwa-boot.is-visible {
        display: flex;
      }
      #pwa-boot.is-hiding {
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
      }
      .pwa-boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .pwa-boot__icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      .pwa-boot__name {
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
        letter-spacing: -0.02em;
      }
      .pwa-boot__status {
        font-size: 14px;
        color: #666666;
        letter-spacing: -0.01em;
        min-height: 1.2em;
        text-align: center;
        padding: 0 24px;
      }
      .pwa-boot__retry {
        display: none;
        margin-top: 4px;
        border: 1px solid #1a1a1a;
        background: #1a1a1a;
        color: #ffffff;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 8px;
      }
      .pwa-boot__retry.is-visible {
        display: inline-block;
      }
    </style>
  </head>

  <body>
    <div id="pwa-boot" aria-hidden="true">
      <div class="pwa-boot__inner">
        <img src="/icon-192.png" alt="" class="pwa-boot__icon" width="96" height="96" />
        <span class="pwa-boot__name">Pomotention</span>
        <span id="pwa-boot-status" class="pwa-boot__status">正在启动…</span>
        <button id="pwa-boot-retry" type="button" class="pwa-boot__retry">重试加载</button>
      </div>
    </div>
    <div id="app" style="height: 100%"></div>
    <script>
      (function () {
        var boot = document.getElementById("pwa-boot");
        var statusEl = document.getElementById("pwa-boot-status");
        var retryBtn = document.getElementById("pwa-boot-retry");
        if (!boot || !statusEl) return;

        function isStandalone() {
          var nav = navigator;
          return !!(nav.standalone || window.matchMedia("(display-mode: standalone)").matches);
        }

        var updating = false;
        try {
          updating = !!localStorage.getItem("pwa-updating");
        } catch (e) {}

        if (isStandalone() || updating) {
          boot.classList.add("is-visible");
          statusEl.textContent = updating ? "正在更新…" : "正在启动…";
        }

        var shellReady = false;

        function setStatus(text) {
          statusEl.textContent = text;
          if (!boot.classList.contains("is-visible")) {
            boot.classList.add("is-visible");
          }
        }

        function hideBoot() {
          shellReady = true;
          if (retryBtn) retryBtn.classList.remove("is-visible");
          if (!boot.classList.contains("is-visible")) return;
          boot.classList.add("is-hiding");
          window.setTimeout(function () {
            boot.classList.remove("is-visible", "is-hiding");
            boot.setAttribute("aria-hidden", "true");
          }, 360);
          try {
            sessionStorage.removeItem("sw-act-reload");
            localStorage.removeItem("pwa-updating");
          } catch (e) {}
        }

        window.addEventListener("pwa-shell-ready", hideBoot);

        // 卡住「正在更新…」时给可操作出口，而不是干等
        window.setTimeout(function () {
          if (shellReady) return;
          setStatus("加载较慢，仍在尝试…");
        }, 8000);
        window.setTimeout(function () {
          if (shellReady) return;
          setStatus("还没加载完，可点下方重试");
          if (retryBtn) retryBtn.classList.add("is-visible");
        }, 14000);

        function markUpdating() {
          try {
            localStorage.setItem("pwa-updating", "1");
          } catch (e) {}
        }

        function hardReload() {
          markUpdating();
          setStatus("正在更新…");
          // iOS PWA 上 replace 比 reload 更稳
          try {
            window.location.replace(window.location.href);
          } catch (e) {
            window.location.reload();
          }
        }

        function reloadOnceForSw() {
          try {
            if (sessionStorage.getItem("sw-act-reload")) return;
            sessionStorage.setItem("sw-act-reload", "1");
          } catch (e) {}
          hardReload();
        }

        if (retryBtn) {
          retryBtn.addEventListener("click", function () {
            try {
              sessionStorage.removeItem("sw-act-reload");
              localStorage.removeItem("pwa-updating");
            } catch (e) {}
            hardReload();
          });
        }

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.addEventListener("message", function (event) {
            var data = event.data;
            if (!data) return;
            if (data.type === "SW_ACTIVATED_RELOAD") {
              reloadOnceForSw();
              return;
            }
            if (data.type !== "SW_PRECACHE_PROGRESS") return;
            // 已进入页面后的后台补缓存不再改启动文案，避免又盖成「下载中」
            if (shellReady) return;
            var loaded = Number(data.loaded) || 0;
            var total = Number(data.total) || 0;
            if (total <= 0) {
              setStatus("正在下载更新…");
              return;
            }
            var pct = Math.floor((loaded / total) * 100);
            if (pct > 100) pct = 100;
            setStatus("正在下载更新 " + pct + "%");
          });

          var refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (refreshing) return;
            refreshing = true;
            reloadOnceForSw();
          });

          window.setTimeout(function () {
            navigator.serviceWorker.register("/sw.js").then(function (reg) {
              if (reg.waiting) {
                reg.waiting.postMessage({ type: "SKIP_WAITING" });
              }
              try {
                reg.update();
              } catch (e) {}
            }).catch(function () {});
          }, 0);
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
